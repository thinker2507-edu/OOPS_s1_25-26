services:
  - type: web
    name: relay-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.cjs
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_CLOUD
        value: "true"
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_TRUST_PROXY
        value: "true"
      - key: EMAIL_DELIVERY_MODE
        value: resend
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_API_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
